name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install uv
      - run: uv sync --project companion --frozen
      - run: uv run --project companion ruff check companion/openlisten companion/tests
      - run: uv run --project companion pytest companion/tests -q
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: swift test --package-path Core
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build iPhone app and widget
        run: xcodebuild -project OpenListen.xcodeproj -scheme OpenListen -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Launch in iPhone simulator
        timeout-minutes: 10
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/Build/Products/Debug-iphonesimulator/OpenListen.app
          xcrun simctl launch "$DEVICE_ID" org.openlisten.app
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot simulator-library.png
      - uses: actions/upload-artifact@v7
        with:
          name: simulator-preview
          path: simulator-library.png
