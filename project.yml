name: OpenListen
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    BASE_BUNDLE_ID: org.openlisten.app
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
packages:
  OpenListenCore:
    path: Core
targets:
  OpenListen:
    type: application
    platform: iOS
    sources: [iOS/OpenListen]
    dependencies:
      - package: OpenListenCore
      - target: OpenListenWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: iOS/OpenListen/Info.plist
      properties:
        CFBundleDisplayName: OpenListen
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: 連接你自己的 OpenListen 電腦工具，將音訊下載到手機。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: org.openlisten
            CFBundleURLSchemes: [openlisten]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  OpenListenWidget:
    type: app-extension
    platform: iOS
    sources: [iOS/Widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: iOS/Widget/Info.plist
      properties:
        CFBundleDisplayName: OpenListen
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  OpenListen:
    build:
      targets:
        OpenListen: all
